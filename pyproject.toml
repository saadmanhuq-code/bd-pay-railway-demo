[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bdpay"
version = "0.1.0"
description = "BD-PAY - Bangladesh PSP/PSO payment platform (single deployable, 8 packages)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "bcrypt>=4.1",
    "defusedxml>=0.7",
    "lxml>=5.0",
    "xmlschema>=3.3",
    "sentry-sdk[fastapi]>=2.0",
    "yubihsm>=3.0",
    "segno>=1.6",
    "pillow>=11.0",
    "fpdf2>=2.8",
    "uharfbuzz>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-json-report>=1.5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["bdpay*", "scripts*"]

[tool.setuptools.package-data]
"bdpay.qr" = ["assets/*.ttf", "assets/FONTS-LICENSE.txt", "DEPS.txt"]
# Deploy-rehearsal fix (2026-06-13): load_thresholds() reads this YAML at app
# boot; without it in package-data the wheel-installed app tier crashed with
# ThresholdsError ("cannot read thresholds artifact"). Editable installs (CI,
# dev) masked the gap because the source tree is on sys.path.
"bdpay.compliance" = ["config/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["vendor", "tests/gateway", "tests/ledger"]
addopts = "--import-mode=importlib"
markers = [
    "integration: requires live Postgres/Redis/Redpanda (deselect with -m 'not integration')",
    "live_network: requires access to public external services (deselect unless --allow-network)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Frozen binding contract (spec 00 section 10) - verbatim, never edited.
"bdpay/connectors/sdk.py" = ["UP042"]
# Ops manifest scripts contain long data literals (route ids, test node ids,
# exemption reasons).  Wrapping them would hurt readability and diff stability.
"scripts/ops/generate_auxiliary_manifests.py" = ["E501"]
"scripts/ops/sync_readiness_ledger.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest-json-report>=1.5.0",
]
