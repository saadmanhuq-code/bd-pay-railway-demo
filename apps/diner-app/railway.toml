# Railway service: set Root Directory to apps/diner-app
[build]
builder = "NIXPACKS"
buildCommand = "cd ../.. && npm ci --ignore-scripts && npm install --ignore-scripts --workspace=packages/edge && cd apps/diner-app && npx next build"

[deploy]
startCommand = "npx next start -p $PORT"
healthcheckPath = "/login"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
